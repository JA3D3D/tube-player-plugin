name: Build Tube Player

on:
  push:
    branches: [main]
    paths-ignore: ["abletonai/**", ".github/workflows/abletonai.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      JUCE_VERSION: "9.0.4"
      # signing switches on by itself once the Apple secrets are added to the repository
      HAVE_SIGNING: ${{ secrets.MACOS_CERTS_P12 != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Get JUCE ${{ env.JUCE_VERSION }}
        run: git clone --depth 1 --branch "$JUCE_VERSION" https://github.com/juce-framework/JUCE.git JUCE

      - name: "Configure (universal: Apple Silicon + Intel)"
        run: >
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
          -DTP_BUILD_TESTS=ON

      - name: Build
        run: |
          set -o pipefail
          cmake --build build --config Release --parallel 4 2>&1 | tee build-output.log

      - name: Plugin tests
        run: |
          set -o pipefail
          ./build/TubePlayerTests_artefacts/Release/TubePlayerTests 2>&1 | tee plugin-tests.log

      # Apple Developer ID certificates (both in one .p12) go into a temporary keychain
      - name: Load signing certificates
        if: env.HAVE_SIGNING == 'true'
        env:
          MACOS_CERTS_P12: ${{ secrets.MACOS_CERTS_P12 }}
          MACOS_CERTS_PASSWORD: ${{ secrets.MACOS_CERTS_PASSWORD }}
        run: |
          KC="$RUNNER_TEMP/signing.keychain-db"; KCPW="$(uuidgen)"
          echo "$MACOS_CERTS_P12" | base64 --decode > "$RUNNER_TEMP/certs.p12"
          security create-keychain -p "$KCPW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KCPW" "$KC"
          security import "$RUNNER_TEMP/certs.p12" -k "$KC" -P "$MACOS_CERTS_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild -T /usr/bin/pkgbuild
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KCPW" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/certs.p12"
          APP_ID=$(security find-identity -v -p codesigning "$KC" | grep "Developer ID Application" | head -1 | sed -E 's/.*"(.*)"/\1/')
          INST_ID=$(security find-identity -v "$KC" | grep "Developer ID Installer" | head -1 | sed -E 's/.*"(.*)"/\1/')
          echo "Signing as: $APP_ID / $INST_ID"
          echo "TP_SIGN_APP=$APP_ID" >> "$GITHUB_ENV"
          echo "TP_SIGN_INSTALLER=$INST_ID" >> "$GITHUB_ENV"

      - name: Package
        run: bash scripts/package_mac.sh

      # Apple checks the installer for malware and approves it ("notarization"); the approval is
      # then attached to the .pkg so it opens without warnings, even offline
      - name: Notarize the installer
        if: env.HAVE_SIGNING == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          set -o pipefail
          xcrun notarytool submit "dist/Tube Player.pkg" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" --wait --timeout 30m 2>&1 | tee notarize.log
          grep -q "status: Accepted" notarize.log
          xcrun stapler staple "dist/Tube Player.pkg" | tee -a notarize.log
          spctl --assess --type install -vv "dist/Tube Player.pkg" 2>&1 | tee -a notarize.log

      # install with the real .pkg, exactly as on your Mac, then check what it installed
      - name: Install the .pkg
        run: |
          sudo installer -pkg "dist/Tube Player.pkg" -target / 2>&1 | tee pkg-install.log
          ls -la "/Library/Audio/Plug-Ins/VST3/Tube Player.vst3/Contents/MacOS" "/Library/Audio/Plug-Ins/Components/Tube Player.component/Contents/MacOS" | tee -a pkg-install.log
          xattr -lr "/Library/Audio/Plug-Ins/VST3/Tube Player.vst3" | grep -c quarantine | xargs echo "quarantine flags:" | tee -a pkg-install.log

      - name: Check the Audio Unit with Apple's validator
        run: |
          set -o pipefail
          killall -9 AudioComponentRegistrar || true
          sleep 3
          auval -a 2>&1 | grep -i "tube" | tee auval.log
          auval -v aufx Tube Bbtl 2>&1 | tee -a auval.log
          grep -q "AU VALIDATION SUCCEEDED" auval.log

      - name: Get pluginval
        run: |
          curl -sSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_macOS.zip
          unzip -q pluginval.zip

      - name: pluginval (installed VST3)
        run: |
          set -o pipefail
          ./pluginval.app/Contents/MacOS/pluginval --strictness-level 5 --skip-gui-tests --timeout-ms 300000 \
            --validate "/Library/Audio/Plug-Ins/VST3/Tube Player.vst3" 2>&1 | tee pluginval.log

      - name: pluginval with the window open (installed VST3 + AU)
        continue-on-error: true
        run: |
          ./pluginval.app/Contents/MacOS/pluginval --strictness-level 5 --timeout-ms 300000 \
            --validate "/Library/Audio/Plug-Ins/VST3/Tube Player.vst3" 2>&1 | tee pluginval-gui.log
          ./pluginval.app/Contents/MacOS/pluginval --strictness-level 5 --timeout-ms 300000 \
            --validate "/Library/Audio/Plug-Ins/Components/Tube Player.component" 2>&1 | tee -a pluginval-gui.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Tube-Player-mac
          path: |
            dist/*.zip
            dist/*.pkg
            *.log

      # The finished zip also goes to the "builds" branch, so it can be fetched with plain git.
      - name: Publish to the builds branch
        if: always()
        run: |
          [ -f "dist/Tube Player.pkg" ] || echo "no installer this time"
          grep -iE "warning|error" build-output.log | grep -E "Source/|tests/" > my-warnings.log || true
          mkdir pub && cd pub
          git init -q -b builds
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp ../dist/*.zip ../dist/*.pkg . 2>/dev/null || true
          mkdir -p logs && cp ../*.log logs/ 2>/dev/null || true
          { echo "commit: $GITHUB_SHA"; echo "built: $(date -u +%Y-%m-%dT%H:%M:%SZ)"; echo "juce: $JUCE_VERSION"; } > BUILD.txt
          git add -A
          git commit -qm "Tube Player build for $GITHUB_SHA"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" builds
